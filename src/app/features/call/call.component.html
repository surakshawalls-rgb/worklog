<div class="call-screen">
  <audio #remoteAudio autoplay playsinline></audio>

  @if (mediaType() === 'video') {
    <video #remoteVideo class="remote-video" autoplay playsinline></video>
    <video #localVideo class="local-video" autoplay muted playsinline></video>
  }

  <div class="call-body">
    @if (mediaType() !== 'video') {
      <div class="peer-avatar">{{ peerName().charAt(0).toUpperCase() }}</div>
    }
    <div class="peer-name">{{ peerName() }}</div>
    <div class="call-status" [class.timer]="callState() === 'connected'">
      {{ statusLabel() }}
    </div>
  </div>

  <div class="call-controls">
    @if (callState() === 'calling' || callState() === 'connected') {
      @if (mediaType() === 'video') {
        <button
          class="ctrl-btn cam-btn"
          [class.active]="isCameraOff()"
          (click)="toggleCamera()"
          title="{{ isCameraOff() ? 'Turn camera on' : 'Turn camera off' }}">
          @if (isCameraOff()) {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23"/>
              <path d="M15 10.5V6a1 1 0 0 0-1-1H4A1 1 0 0 0 3 6v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4.5"/>
              <path d="M16 8l5-3v14l-5-3"/>
            </svg>
          } @else {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="12" height="14" rx="2" ry="2"/>
              <polygon points="16 8 21 5 21 19 16 16"/>
            </svg>
          }
        </button>
      }

      <button
        class="ctrl-btn mute-btn"
        [class.active]="isMuted()"
        (click)="toggleMute()"
        title="{{ isMuted() ? 'Unmute' : 'Mute' }}">
        @if (isMuted()) {
          <!-- mic-off -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        } @else {
          <!-- mic -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        }
        <span class="ctrl-label">{{ isMuted() ? 'Unmute' : 'Mute' }}</span>
      </button>

      <button class="ctrl-btn end-btn" (click)="endCall()" title="End call">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 4.26 9.8 19.79 19.79 0 0 1 1.19 1.17 2 2 0 0 1 3.17 0h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.15 7.91"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <span class="ctrl-label">End</span>
      </button>
    }

    @if (callState() === 'ended') {
      <div class="ended-msg">Call ended</div>
    }
  </div>
</div>
